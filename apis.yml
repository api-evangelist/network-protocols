aid: network-protocols
name: Network Protocols
description: >-
  Network protocols are the standardized rules and conventions for
  communication between network devices. They include foundational
  protocols such as TCP/IP, HTTP, HTTPS, DNS, BGP, SMTP, FTP, SSH and many
  others that enable data exchange across networks. Network protocols are
  fundamental to modern network architectures and underpin reliable
  communication between systems.
